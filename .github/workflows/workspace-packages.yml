name: Workspace installers

on:
  workflow_dispatch:
    inputs:
      windows-baseline-run:
        description: Optional successful installer run to test Windows upgrades from
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      windows-baseline-run:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  DESKFLOW_NATIVE_CLIPBOARD_TESTS: "1"

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Qt and OpenSSL
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.8.3
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON
          "-DDESKFLOW_VERSION_OVERRIDE=1.28.1"
          "-DPACKAGE_VERSION_LABEL=1.28.1-workspace"
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
      - name: Compile
        run: cmake --build build --parallel 4
      - name: Test without desktop input injection
        run: ctest --test-dir build/src/unittests --output-on-failure -E "^(MSWindowsClipboardTests|OSXKeyStateTests|OSXClipboardTests)$"
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build -D CPACK_DMG_DS_STORE_SETUP_SCRIPT=
      - name: Verify deployed application
        run: python3 deploy/verify-macos-bundle.py --find-in build/_CPack_Packages --output build/macos-bundle-validation.json
      - name: Include installation guide
        run: |
          cp docs/WorkspaceGuide.zh-CN.md build/使用说明.md
          python3 deploy/render-workspace-guide.py --output build/使用说明.html --images build/validation/ui --revision "$GITHUB_SHA"
          shasum -a 256 build/deskflow-*.dmg > build/SHA256.txt
      - name: Upload packages and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskflow-workspace-macos-arm64
          path: |
            build/deskflow-*.dmg
            build/使用说明.md
            build/使用说明.html
            build/SHA256.txt
            build/macos-bundle-validation.json
            build/validation/ui/*.png
            build/src/unittests/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true
      - name: Install Qt OpenSSL and WiX
        id: deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.8.3
          vcpkg-triplet: x64-windows-release
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON
          "-DDESKFLOW_VERSION_OVERRIDE=1.28.1"
          "-DPACKAGE_VERSION_LABEL=1.28.1-workspace"
          ${{ steps.deps.outputs.vcpkg-cmake-config }}
      - name: Compile
        run: cmake --build build --parallel 4
      - name: Prepare runtime library path
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/build/bin"
          $line = Get-Content build/CMakeCache.txt | Where-Object { $_ -match '^OPENSSL_INCLUDE_DIR:PATH=' } | Select-Object -First 1
          if ($line) {
            $include = ($line -split '=', 2)[1]
            $bin = Join-Path (Split-Path $include -Parent) 'bin'
            if (Test-Path $bin) {
              Add-Content $env:GITHUB_PATH $bin
              Get-ChildItem $bin -Filter '*.dll' | Copy-Item -Destination build/bin
            }
          }
      - name: Test without desktop input injection
        run: ctest --test-dir build/src/unittests --output-on-failure -E "^(MSWindowsClipboardTests|OSXKeyStateTests|OSXClipboardTests)$"
      - name: Build installers
        run: cmake --build build --target package --parallel 4
      - name: Download previous installer for upgrade regression
        if: inputs.windows-baseline-run != ''
        uses: actions/download-artifact@v4
        with:
          name: deskflow-workspace-windows-x64
          path: build/upgrade-baseline
          run-id: ${{ inputs.windows-baseline-run }}
          github-token: ${{ github.token }}
      - name: Verify MSI install and uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/deskflow-*.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer is missing' }
          $installLog = Join-Path $env:GITHUB_WORKSPACE 'build/windows-install.log'
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi.FullName + '"'), '/qn', '/norestart', '/L*v', ('"' + $installLog + '"')) -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { Get-Content $installLog -Tail 100; throw "MSI installation failed: $($install.ExitCode)" }
          $portable = Get-ChildItem build/deskflow-*-portable.zip | Select-Object -First 1
          ./deploy/verify-windows-package.ps1 -ExpectedVersion 1.28.1 -Output build/windows-package-validation.json -PortableZip $portable.FullName
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', ('"' + $msi.FullName + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
      - name: Verify upgrade with existing legacy settings
        if: inputs.windows-baseline-run != ''
        shell: pwsh
        run: |
          $baseline = Get-ChildItem build/upgrade-baseline/deskflow-*.msi | Select-Object -First 1
          $candidate = Get-ChildItem build/deskflow-*.msi | Select-Object -First 1
          ./deploy/test-windows-upgrade.ps1 -BaselineMsi $baseline.FullName -CandidateMsi $candidate.FullName -Output build/windows-upgrade-validation.json
          ./deploy/verify-windows-package.ps1 -ExpectedVersion 1.28.1 -Output build/windows-upgrade-runtime-validation.json
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', ('"' + $candidate.FullName + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "Upgraded MSI uninstall failed: $($uninstall.ExitCode)" }
      - name: Include installation guide
        shell: pwsh
        run: |
          Copy-Item docs/WorkspaceGuide.zh-CN.md build/使用说明.md
          python deploy/render-workspace-guide.py --output build/使用说明.html --images build/validation/ui --revision $env:GITHUB_SHA
          Get-ChildItem build/deskflow-*.msi,build/deskflow-*.zip | Get-FileHash -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 build/SHA256.txt
      - name: Upload packages and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskflow-workspace-windows-x64
          path: |
            build/deskflow-*.msi
            build/deskflow-*.zip
            build/使用说明.md
            build/使用说明.html
            build/SHA256.txt
            build/installed-version.txt
            build/windows-package-validation.json
            build/windows-upgrade-validation.json
            build/windows-upgrade-runtime-validation.json
            build/*install*.log
            build/src/unittests/Testing/Temporary/LastTest.log
          if-no-files-found: warn
